# cachex memcached 驱动示例配置
#
# 默认连本机标准端口 11211（Memcached 无鉴权），与 kvx/memcached 示例保持一致。
#
# ⚠️ 若改用本驱动自带的 cachex/memcached/scripts/start.sh 起环境，那套 compose
# 的宿主端口是 **21121**（避开本机常见占用），需要把 addr 改成 127.0.0.1:21121。
#
# 调用链：enable_trace 打开后缓存操作会产 cachex.* span；宿主侧装配 otelx
# 后可在 Jaeger 看到，未装配时落在 noop provider 上，不影响功能。
cachex:
  enable_trace: true
  instances:
    - name: default
      driver: memcached
      addr: "127.0.0.1:11211"
      pool_size: 10
      timeout: 3s
      enable_trace: true
