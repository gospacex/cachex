# cachex — Pebble embedded backend + trace export (new schema, mqx-aligned).
# Load with: cachex.LoadConfig("configs/pebble.yaml")
backend: pebble
dir: ${env:PEBBLE_PATH:-/tmp/cachex-pebble}
file_mode: 384
mmap_size: 67108864
read_only: false
sync_writes: false
in_memory: false
block_cache_size: 67108864
mem_table_size: 67108864
compression: true
circuit_breaker:
  enabled: true
  threshold: 5
  timeout: 30
  half_open_max_requests: 3
metrics: true
metrics_prefix: cachex
logger:
  level: info
  format: json
  output: stdout
trace:
  enabled: true
  service_name: ${env:MQ_SERVICE_NAME:-cachex-pebble}
  exporter: ${env:MQ_TRACE_BACKEND:-jaeger}
  endpoint: ${env:MQ_JAEGER_ENDPOINT:-http://localhost:14268/api/traces}
  insecure: true
  protocol: ${env:MQ_TRACE_PROTOCOL:-grpc}
  sampler_type: ${env:MQ_SAMPLER_TYPE:-always_on}
  sampler_ratio: 1.0
  stream: ${env:TRACE_REDIS_STREAM:-trace:cachex:pebble}
  topic: ${env:TRACE_KAFKA_TOPIC:-trace-spans-cachex}
  brokers:
    - ${env:KAFKA_BROKER:-localhost:9092}
